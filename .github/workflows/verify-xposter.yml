name: Verify xposter release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-xposter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IYH_KEY: ""

jobs:
  verify:
    name: npm ci / test / test:electron / audit / build / package smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Appimage
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node (matches package.json engines + README)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Appimage/package-lock.json

      - name: Install system dependencies (Xvfb + AppImage FUSE fallback)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libfuse2

      - name: Run the shared verification gate
        run: bash scripts/verify-release.sh

      - name: Upload built AppImage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xposter-appimage
          path: Appimage/dist/*.AppImage
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xposter-failure-logs
          path: |
            Appimage/dist/builder-*.yml
            Appimage/dist/builder-effective-config.yaml
            /tmp/xposter-verify-home-*/boot.log
          if-no-files-found: ignore
          retention-days: 14
