name: Verify xposter audit completion

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: xposter-completion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bot Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-direct-x.txt
      - name: Run Bot unified test suite (Node + Python + E2E)
        run: npm test

  baseline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Appimage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Appimage/package-lock.json
      - run: npm ci
      - name: Run baseline tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 20m npm run test:baseline 2>&1 | tee baseline-tests.log
      - name: Upload baseline failure log
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: xposter-baseline-failure-log
          path: Appimage/baseline-tests.log
          if-no-files-found: error

  workflow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Appimage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Appimage/package-lock.json
      - run: npm ci
      - name: Run durable workflow tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 20m npm run test:workflow 2>&1 | tee workflow-tests.log
      - name: Upload workflow failure log
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: xposter-workflow-failure-log
          path: Appimage/workflow-tests.log
          if-no-files-found: error

  electron-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Appimage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Appimage/package-lock.json
      - run: npm ci
      - name: Run Electron integration tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 12m npm run test:electron 2>&1 | tee electron-tests.log
      - name: Upload Electron failure log
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: xposter-electron-failure-log
          path: Appimage/electron-tests.log
          if-no-files-found: error

  package-appimage:
    needs: [bot-tests, baseline-tests, workflow-tests, electron-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Appimage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Appimage/package-lock.json
      - run: npm ci
      - name: Build Linux AppImage
        id: build
        shell: bash
        run: |
          set -o pipefail
          npm run build:linux 2>&1 | tee appimage-build.log
      - name: Upload build failure log
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: xposter-build-failure-log
          path: Appimage/appimage-build.log
          if-no-files-found: error
      - name: Boot AppImage in isolated HOME
        id: boot
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          APPIMAGE="$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          chmod +x "$APPIMAGE"
          ISO_HOME="$(mktemp -d)"
          export HOME="$ISO_HOME"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_CACHE_HOME="$HOME/.cache"
          export XDG_DATA_HOME="$HOME/.local/share"
          export TMPDIR="$HOME/tmp"
          export APPIMAGE_EXTRACT_AND_RUN=1
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_DATA_HOME" "$TMPDIR"
          set +e
          xvfb-run -a -f "$HOME/.Xauthority" timeout --signal=TERM --kill-after=10s 30s "$APPIMAGE" --no-sandbox --disable-gpu 2>&1 | tee appimage-boot.log
          CODE=${PIPESTATUS[0]}
          set -e
          if [ "$CODE" -ne 124 ] && [ "$CODE" -ne 137 ]; then
            echo "Unexpected AppImage boot exit code: $CODE (expected 124 or 137 after 30s soak)" >&2
            exit "$CODE"
          fi
          test -s "$HOME/.config/x-poster-shared/workflow.sqlite"
      - name: Upload AppImage boot failure log
        if: ${{ failure() && steps.boot.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: xposter-appimage-boot-failure-log
          path: Appimage/appimage-boot.log
          if-no-files-found: warn
      - name: Capture production dependency audit
        shell: bash
        run: |
          npm audit --omit=dev --json > audit-prod.json || true
      - name: Upload production audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xposter-production-audit
          path: Appimage/audit-prod.json
          if-no-files-found: error
      - name: Enforce production dependency audit
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit-prod.json', 'utf8'));
          if (audit.error) {
            console.error('npm audit returned an error payload:', JSON.stringify(audit.error));
            process.exit(1);
          }
          const counts = audit.metadata && audit.metadata.vulnerabilities;
          if (!counts || typeof counts !== 'object' || !Number.isInteger(counts.high) || !Number.isInteger(counts.critical)) {
            console.error('npm audit output is missing valid metadata.vulnerabilities counts:', JSON.stringify(audit.metadata || null));
            process.exit(1);
          }
          const { high, critical } = counts;
          console.log(`production audit: high=${high}, critical=${critical}`);
          if (high > 0 || critical > 0) process.exit(1);
          NODE
      - name: Read package version
        id: pkg_meta
        shell: bash
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Upload verified AppImage
        uses: actions/upload-artifact@v4
        with:
          name: YJAutoPostOnX-${{ steps.pkg_meta.outputs.version }}-AppImage
          path: Appimage/dist/*.AppImage
          if-no-files-found: error
