name: Verify xposter audit completion

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: xposter-completion-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

jobs:
  baseline-tests:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/xposter-completion-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/xposter-completion-20260726
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run baseline tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 20m npm run test:baseline 2>&1 | tee baseline-tests.log
      - name: Upload baseline failure log
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: xposter-baseline-failure-log
          path: baseline-tests.log
          if-no-files-found: error

  workflow-tests:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/xposter-completion-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/xposter-completion-20260726
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run durable workflow tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 20m npm run test:workflow 2>&1 | tee workflow-tests.log
      - name: Upload workflow failure log
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: xposter-workflow-failure-log
          path: workflow-tests.log
          if-no-files-found: error

  electron-tests:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/xposter-completion-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/xposter-completion-20260726
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Electron integration tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 12m npm run test:electron 2>&1 | tee electron-tests.log
      - name: Upload Electron failure log
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: xposter-electron-failure-log
          path: electron-tests.log
          if-no-files-found: error

  package-appimage:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/xposter-completion-20260726'
    needs: [baseline-tests, workflow-tests, electron-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/xposter-completion-20260726
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Linux AppImage
        id: build
        shell: bash
        run: |
          set -o pipefail
          npm run build:linux 2>&1 | tee appimage-build.log
      - name: Upload build failure log
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: xposter-build-failure-log
          path: appimage-build.log
          if-no-files-found: error
      - name: Boot AppImage in isolated HOME
        id: boot
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          chmod +x "$APPIMAGE"
          ISO_HOME="$(mktemp -d)"
          export HOME="$ISO_HOME"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_CACHE_HOME="$HOME/.cache"
          export XDG_DATA_HOME="$HOME/.local/share"
          export APPIMAGE_EXTRACT_AND_RUN=1
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_DATA_HOME"
          set +e
          timeout --signal=TERM --kill-after=10s 30s xvfb-run -a "$APPIMAGE" --no-sandbox 2>&1 | tee appimage-boot.log
          CODE=${PIPESTATUS[0]}
          set -e
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 124 ]; then
            exit "$CODE"
          fi
          test -f "$HOME/.config/x-poster-shared/workflow.sqlite"
      - name: Upload AppImage boot failure log
        if: ${{ failure() && steps.boot.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: xposter-appimage-boot-failure-log
          path: appimage-boot.log
          if-no-files-found: warn
      - name: Audit production dependencies
        shell: bash
        run: |
          npm audit --omit=dev --audit-level=high
      - name: Upload verified AppImage
        uses: actions/upload-artifact@v4
        with:
          name: YJAutoPostOnX-5.20.0-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
