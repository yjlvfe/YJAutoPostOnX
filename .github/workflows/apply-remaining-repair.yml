name: Verify xposter audit completion

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-test-build:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/xposter-completion-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/xposter-completion-20260726
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Skip after verified completion
        id: guard
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          LAST="$(git log -1 --pretty=%B)"
          if [ "$VERSION" = "5.20.0" ] || grep -q '\[xposter-complete\]' <<<"$LAST"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply audited source transformations
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -o pipefail
          {
            node scripts/apply-remaining-repair.cjs
            node scripts/prepare-xposter-followup.cjs
            node scripts/apply-xposter-followup.cjs
          } 2>&1 | tee xposter-ci-apply.log
      - name: Upload apply failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xposter-apply-failure-log
          path: xposter-ci-apply.log
          if-no-files-found: error
      - name: Bump package version
        if: steps.guard.outputs.skip != 'true'
        run: npm version 5.20.0 --no-git-tag-version
      - name: Install exact dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci
      - name: Run complete test suite
        if: steps.guard.outputs.skip != 'true'
        run: npm test
      - name: Run Electron and renderer integration tests
        if: steps.guard.outputs.skip != 'true'
        run: npm run test:electron
      - name: Build Linux AppImage
        if: steps.guard.outputs.skip != 'true'
        run: npm run build:linux
      - name: Boot built AppImage in an isolated HOME
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          chmod +x "$APPIMAGE"
          ISO_HOME="$(mktemp -d)"
          export HOME="$ISO_HOME"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_CACHE_HOME="$HOME/.cache"
          export XDG_DATA_HOME="$HOME/.local/share"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_DATA_HOME"
          set +e
          timeout 30s xvfb-run -a "$APPIMAGE" --no-sandbox
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 124 ]; then
            exit "$CODE"
          fi
          test -f "$HOME/.config/x-poster-shared/workflow.sqlite"
      - name: Capture production dependency audit
        if: steps.guard.outputs.skip != 'true'
        run: npm audit --omit=dev --json > audit-prod.json || true
      - name: Commit verified repair
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev test package.json package-lock.json .github/workflows/ci.yml audit-prod.json
          git commit -m "fix: complete xposter durable workflow repair [xposter-complete]"
          git push origin HEAD:fix/xposter-completion-20260726
      - name: Upload verified AppImage
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: YJAutoPostOnX-5.20.0-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
